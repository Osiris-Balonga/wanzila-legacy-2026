name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request direction
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE" == "main" && "$HEAD" != "dev" ]]; then
            echo "Only dev may open a pull request into main."
            exit 1
          fi
          if [[ "$BASE" == "dev" && ! "$HEAD" =~ ^(feature/(web|api|data|admin|design)/.+|fix/.+|test/.+|docs/.+|chore/.+|dependabot/.+)$ ]]; then
            echo "Branches targeting dev must use an approved short-lived branch prefix."
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
